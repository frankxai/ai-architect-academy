name: Academy domain contract

on:
  pull_request:
    paths:
      - ".github/workflows/academy-domain-contract.yml"
      - "redirect-bridge/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/academy-domain-contract.yml"
      - "redirect-bridge/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academy-domain-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-contract:
    name: Validate bridge contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Validate static and public-smoke contracts
        run: npm test --prefix redirect-bridge
