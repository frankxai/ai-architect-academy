<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="OpenCode, Cloudflare AI Gateway, and Workers AI 3-tier reference stack">
  <title>OpenCode, Cloudflare AI Gateway, and Workers AI 3-tier reference stack</title>
  <desc>Three-tier reference architecture connecting the OpenCode coding harness through Cloudflare AI Gateway to Cloudflare Workers AI serverless inference.</desc>
  <defs>
    <linearGradient id="stage-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1017" />
      <stop offset="60%" stop-color="#121522" />
      <stop offset="100%" stop-color="#141826" />
    </linearGradient>
    <linearGradient id="cobalt-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c93ff" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#5ee6cf" stop-opacity="0.52" />
    </linearGradient>
    <radialGradient id="cobalt-glow" cx="18%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#1f3bd6" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#1f3bd6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mint-glow" cx="88%" cy="86%" r="50%">
      <stop offset="0%" stop-color="#5ee6cf" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#5ee6cf" stop-opacity="0" />
    </radialGradient>
    <pattern id="academy-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2d344d" fill-opacity="0.55" />
    </pattern>
    <marker id="arrow-cobalt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#a9b8ff" />
    </marker>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#5ee6cf" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#ffc07a" />
    </marker>
  </defs>
  <style>
    text { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  </style>
  <rect width="1200" height="680" rx="18" fill="url(#stage-grad)" />
  <rect width="1200" height="680" rx="18" fill="url(#academy-grid)" />
  <rect width="1200" height="680" rx="18" fill="url(#cobalt-glow)" />
  <rect width="1200" height="680" rx="18" fill="url(#mint-glow)" />
  <rect x="1" y="1" width="1198" height="678" rx="17" fill="none" stroke="#2d344d" stroke-width="1.5" />
  
  <g>
    <rect x="40" y="34" width="8" height="8" rx="4" fill="#5ee6cf" />
    <text x="58" y="42" class="mono" font-size="11.5" fill="#a9b8ff" letter-spacing="0.9">Reference stack blueprint</text>
    <rect x="920" y="24" width="240" height="28" rx="14" fill="#151824" stroke="#2d344d" />
    <text x="1040" y="42" text-anchor="middle" class="mono" font-size="11.5" fill="#5ee6cf">3-tier edge stack</text>
    <text x="40" y="78" class="serif" font-size="28" font-weight="600" fill="#f2f1ec">OpenCode -&gt; Cloudflare AI Gateway -&gt; Workers AI</text>
    <text x="40" y="103" font-size="13.8" fill="#cbd5e1">Three-tier coding agent architecture with centralized routing, caching, cost telemetry, and edge inference</text>
    <line x1="40" y1="120" x2="1160" y2="120" stroke="#2d344d" stroke-width="1" />
  </g>
<g>
      <rect x="40" y="152" width="360" height="364" rx="16" fill="#1f2640" stroke="url(#cobalt-stroke)" stroke-width="1.6" />
      <rect x="60" y="174" width="196" height="26" rx="13" fill="#151824" stroke="#2d344d" />
      <text x="158" y="191" text-anchor="middle" class="mono" font-size="11" fill="#a9b8ff">Tier 01 · Coding harness</text>
      <text x="60" y="232" class="serif" font-size="22" font-weight="600" fill="#f2f1ec">OpenCode CLI &amp; IDE workspace</text>
      <text x="60" y="258" font-size="12.8" fill="#cbd5e1">Developer-controlled terminal and editor</text>
    <text x="60" y="275" font-size="12.8" fill="#cbd5e1">agent harness</text>
      <line x1="60" y1="286" x2="380" y2="286" stroke="#2d344d" />
      <circle cx="66" cy="312" r="3.2" fill="#a9b8ff" />
        <text x="78" y="316" font-size="12.4" fill="#f2f1ec">Repository context, AST search, and diff</text>
    <text x="78" y="332" font-size="12.4" fill="#f2f1ec">edits</text>
      <circle cx="66" cy="360" r="3.2" fill="#a9b8ff" />
        <text x="78" y="364" font-size="12.4" fill="#f2f1ec">Scoped local tool execution with git</text>
    <text x="78" y="380" font-size="12.4" fill="#f2f1ec">worktree isolation</text>
      <circle cx="66" cy="408" r="3.2" fill="#a9b8ff" />
        <text x="78" y="412" font-size="12.4" fill="#f2f1ec">OpenAI-compatible provider SDK pointed at</text>
    <text x="78" y="428" font-size="12.4" fill="#f2f1ec">gateway URL</text>
      <circle cx="66" cy="456" r="3.2" fill="#a9b8ff" />
        <text x="78" y="460" font-size="12.4" fill="#f2f1ec">Session state and reproducible command</text>
    <text x="78" y="476" font-size="12.4" fill="#f2f1ec">logs</text>
      <g>
          <line x1="400" y1="305" x2="418" y2="305" stroke="#a9b8ff" stroke-width="2.2" marker-end="url(#arrow-cobalt)" />
          <line x1="418" y1="345" x2="400" y2="345" stroke="#5ee6cf" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-mint)" />
        </g>
    </g>
  <g>
      <rect x="420" y="152" width="360" height="364" rx="16" fill="#1f2640" stroke="url(#cobalt-stroke)" stroke-width="1.6" />
      <rect x="440" y="174" width="196" height="26" rx="13" fill="#151824" stroke="#2d344d" />
      <text x="538" y="191" text-anchor="middle" class="mono" font-size="11" fill="#5ee6cf">Tier 02 · Edge control plane</text>
      <text x="440" y="232" class="serif" font-size="22" font-weight="600" fill="#f2f1ec">Cloudflare AI Gateway</text>
      <text x="440" y="258" font-size="12.8" fill="#cbd5e1">Central policy, caching, routing, and</text>
    <text x="440" y="275" font-size="12.8" fill="#cbd5e1">telemetry proxy</text>
      <line x1="440" y1="286" x2="760" y2="286" stroke="#2d344d" />
      <circle cx="446" cy="312" r="3.2" fill="#5ee6cf" />
        <text x="458" y="316" font-size="12.4" fill="#f2f1ec">Unified authentication, per-project rate</text>
    <text x="458" y="332" font-size="12.4" fill="#f2f1ec">limits, and budget caps</text>
      <circle cx="446" cy="360" r="3.2" fill="#5ee6cf" />
        <text x="458" y="364" font-size="12.4" fill="#f2f1ec">Exact and semantic response caching for</text>
    <text x="458" y="380" font-size="12.4" fill="#f2f1ec">repeated context</text>
      <circle cx="446" cy="408" r="3.2" fill="#5ee6cf" />
        <text x="458" y="412" font-size="12.4" fill="#f2f1ec">Automatic provider fallback and request</text>
    <text x="458" y="428" font-size="12.4" fill="#f2f1ec">retry policies</text>
      <circle cx="446" cy="456" r="3.2" fill="#5ee6cf" />
        <text x="458" y="460" font-size="12.4" fill="#f2f1ec">Token, latency, cost, and error</text>
    <text x="458" y="476" font-size="12.4" fill="#f2f1ec">observability logs</text>
      <g>
          <line x1="780" y1="305" x2="798" y2="305" stroke="#a9b8ff" stroke-width="2.2" marker-end="url(#arrow-cobalt)" />
          <line x1="798" y1="345" x2="780" y2="345" stroke="#5ee6cf" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-mint)" />
        </g>
    </g>
  <g>
      <rect x="800" y="152" width="360" height="364" rx="16" fill="#1f2640" stroke="url(#cobalt-stroke)" stroke-width="1.6" />
      <rect x="820" y="174" width="196" height="26" rx="13" fill="#151824" stroke="#2d344d" />
      <text x="918" y="191" text-anchor="middle" class="mono" font-size="11" fill="#ffc07a">Tier 03 · Serverless inference</text>
      <text x="820" y="232" class="serif" font-size="22" font-weight="600" fill="#f2f1ec">Cloudflare Workers AI</text>
      <text x="820" y="258" font-size="12.8" fill="#cbd5e1">Low-latency edge GPU inference and vector</text>
    <text x="820" y="275" font-size="12.8" fill="#cbd5e1">retrieval</text>
      <line x1="820" y1="286" x2="1140" y2="286" stroke="#2d344d" />
      <circle cx="826" cy="312" r="3.2" fill="#ffc07a" />
        <text x="838" y="316" font-size="12.4" fill="#f2f1ec">Open-weight coding and reasoning models on</text>
    <text x="838" y="332" font-size="12.4" fill="#f2f1ec">global edge GPUs</text>
      <circle cx="826" cy="360" r="3.2" fill="#ffc07a" />
        <text x="838" y="364" font-size="12.4" fill="#f2f1ec">Streaming SSE completions back through AI</text>
    <text x="838" y="380" font-size="12.4" fill="#f2f1ec">Gateway</text>
      <circle cx="826" cy="408" r="3.2" fill="#ffc07a" />
        <text x="838" y="412" font-size="12.4" fill="#f2f1ec">BGE text embeddings paired with Cloudflare</text>
    <text x="838" y="428" font-size="12.4" fill="#f2f1ec">Vectorize</text>
      <circle cx="826" cy="456" r="3.2" fill="#ffc07a" />
        <text x="838" y="460" font-size="12.4" fill="#f2f1ec">Zero idle GPU provisioning with bounded</text>
    <text x="838" y="476" font-size="12.4" fill="#f2f1ec">per-request billing</text>
      
    </g>

  <g>
    <rect x="40" y="544" width="1120" height="96" rx="14" fill="#231f2e" stroke="#ffc07a" stroke-opacity="0.55" />
    <text x="64" y="574" class="mono" font-size="11.5" fill="#ffc07a">End-to-end request and governance flow</text>
    <text x="64" y="598" font-size="13.5" fill="#f2f1ec">1. OpenCode sends OpenAI-compatible chat/tool requests -> 2. Cloudflare AI Gateway enforces auth, cache, and budget policy -> 3. Workers AI streams tokens.</text>
    <text x="64" y="620" font-size="12.5" fill="#cbd5e1">Swap or add upstream frontier providers behind AI Gateway without changing local agent harness configuration.</text>
  </g>
</svg>
