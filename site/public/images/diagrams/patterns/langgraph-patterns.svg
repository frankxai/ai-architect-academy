      <text x="624" y="218" font-size="16.5" font-weight="620" fill="#f2f1ec">Conditional control</text>
      <line x1="624" y1="234" x2="858" y2="234" stroke="#2d344d" />
      <rect x="624" y="250" width="234" height="54" rx="9" fill="#1b2032" stroke="#2d344d" />
        <text x="636" y="272" font-size="13" font-weight="600" fill="#f2f1ec">should_continue()</text>
