<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="LangGraph state machine patterns">
  <title>LangGraph state machine patterns</title>
  <desc>LangGraph state machine patterns: Explicit state schemas, conditional edge transitions, durable checkpoints, and human review gates</desc>
  <defs>
