      <rect x="56" y="316" width="234" height="54" rx="9" fill="#1b2032" stroke="#2d344d" />
        <text x="68" y="338" font-size="13" font-weight="600" fill="#f2f1ec">Task context dict</text>
        <text x="68" y="357" font-size="11.5" fill="#cbd5e1">Retrieved citations &amp; inputs</text>
      <rect x="56" y="382" width="234" height="54" rx="9" fill="#1b2032" stroke="#2d344d" />
        <text x="68" y="404" font-size="13" font-weight="600" fill="#f2f1ec">Next-step pointer</text>
        <text x="68" y="423" font-size="11.5" fill="#cbd5e1">Deterministic route state</text>
      <rect x="56" y="448" width="234" height="54" rx="9" fill="#1b2032" stroke="#2d344d" />
        <text x="68" y="470" font-size="13" font-weight="600" fill="#f2f1ec">Attempt counter</text>
