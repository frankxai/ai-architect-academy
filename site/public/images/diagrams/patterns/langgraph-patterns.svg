      <rect x="908" y="316" width="234" height="54" rx="9" fill="#1b2032" stroke="#2d344d" />
        <text x="920" y="338" font-size="13" font-weight="600" fill="#f2f1ec">Time-travel replay</text>
        <text x="920" y="357" font-size="11.5" fill="#cbd5e1">Resume from any prior node</text>
      <rect x="908" y="382" width="234" height="54" rx="9" fill="#1b2032" stroke="#2d344d" />
        <text x="920" y="404" font-size="13" font-weight="600" fill="#f2f1ec">Idempotent tool calls</text>
        <text x="920" y="423" font-size="11.5" fill="#cbd5e1">Safe recovery on crash</text>
      <rect x="908" y="448" width="234" height="54" rx="9" fill="#1b2032" stroke="#2d344d" />
        <text x="920" y="470" font-size="13" font-weight="600" fill="#f2f1ec">Terminal END state</text>
        <text x="920" y="489" font-size="11.5" fill="#cbd5e1">Auditable state transition log</text>
      
    </g>

  <g>
    <rect x="40" y="548" width="1120" height="92" rx="14" fill="#231f2e" stroke="#ffc07a" stroke-opacity="0.52" />
    <text x="62" y="578" class="mono" font-size="11.5" fill="#ffc07a">Why state graphs beat unconstrained loops</text>
    <text x="62" y="602" font-size="13.2" fill="#f2f1ec">Persisting typed state at every node boundary lets operators pause for human approval, inspect intermediate state, and</text>
    <text x="62" y="621" font-size="13.2" fill="#f2f1ec">resume cleanly after failures.</text>
