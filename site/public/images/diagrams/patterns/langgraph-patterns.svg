      <rect x="624" y="448" width="234" height="54" rx="9" fill="#1b2032" stroke="#2d344d" />
        <text x="636" y="470" font-size="13" font-weight="600" fill="#f2f1ec">Revise cycle</text>
        <text x="636" y="489" font-size="11.5" fill="#cbd5e1">Feeds critique back to writer</text>
