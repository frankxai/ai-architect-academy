<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="In-product copilot on AWS" viewBox="0 0 1832 592" style="font-family:Inter,system-ui,sans-serif"><title>In-product copilot on AWS: designed architecture, not a deployed system</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9aa3b5"/></marker></defs><rect width="100%" height="100%" fill="#0f1017"/><path data-flow="open" d="M292 276C316 276 316 276 340 276" fill="none" stroke="#9aa3b5" stroke-width="1.5" marker-end="url(#arrow)"><title>Question in context (data, tenant)</title></path><path data-flow="protect" d="M466 220C466 186 466 186 466 152" fill="none" stroke="#9aa3b5" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"><title>Tenant rate limits (control, operational)</title></path><path data-flow="send" d="M592 276C616 276 616 276 640 276" fill="none" stroke="#9aa3b5" stroke-width="1.5" marker-end="url(#arrow)"><title>Question and screen context (data, tenant)</title></path><path data-flow="scope" d="M766 220C766 186 766 186 766 152" fill="none" stroke="#9aa3b5" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"><title>Resolve tenant from session (control, identity)</title></path><path data-flow="retrieve" d="M892 276C916 276 916 456 940 456" fill="none" stroke="#9aa3b5" stroke-width="1.5" marker-end="url(#arrow)"><title>Tenant namespace query (data, tenant)</title></path><path data-flow="ask-model" d="M892 276C916 276 916 96 940 96" fill="none" stroke="#9aa3b5" stroke-width="1.5" marker-end="url(#arrow)"><title>Prompt tagged with tenant (data, tenant)</title></path><path data-flow="infer" d="M1192 96C1216 96 1216 96 1240 96" fill="none" stroke="#9aa3b5" stroke-width="1.5" marker-end="url(#arrow)"><title>Model call (data, tenant)</title></path><path data-flow="propose" d="M892 276C916 276 916 276 940 276" fill="none" stroke="#9aa3b5" stroke-width="1.5" marker-end="url(#arrow)"><title>Proposed action (dry run) (data, tenant)</title></path><path data-flow="apply" d="M1192 276C1216 276 1216 276 1240 276" fill="none" stroke="#9aa3b5" stroke-width="1.5" marker-end="url(#arrow)"><title>Confirmed write with undo token (data, tenant)</title></path><path data-flow="meter-usage" d="M1066 152C1066 276 1366 276 1366 400" fill="none" stroke="#9aa3b5" stroke-width="1.5" stroke-dasharray="1 5" stroke-linecap="round" marker-end="url(#arrow)"><title>Tokens per tenant (telemetry, operational)</title></path><path data-flow="telemetry" d="M892 276C1216 276 1216 96 1540 96" fill="none" stroke="#9aa3b5" stroke-width="1.5" stroke-dasharray="1 5" stroke-linecap="round" marker-end="url(#arrow)"><title>Latency and refusals (telemetry, operational)</title></path><path data-flow="probe" d="M1540 276C1216 276 1216 276 892 276" fill="none" stroke="#9aa3b5" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"><title>Cross-tenant probes per release (control, internal)</title></path><g data-component="tenant-user"><rect x="40" y="220" width="252" height="112" rx="14" fill="#151824" stroke="#8AB4FF" stroke-opacity="0.55"/><g transform="translate(60 242) scale(1.1)" fill="none" stroke="#8AB4FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M5 21a7 7 0 0 1 14 0"/></g><text x="102" y="254" font-size="14" font-weight="600" fill="#f2f1ec">Tenant user</text><text x="102" y="274" font-size="11" fill="#8AB4FF"><tspan x="102" dy="0">Person</tspan></text><text x="56" y="316" font-size="10" fill="#8b90a0">tenant-user · tenant</text><title>Works in the product; opens the copilot in context.</title></g><g data-component="product"><rect x="340" y="220" width="252" height="112" rx="14" fill="#151824" stroke="#8AB4FF" stroke-opacity="0.55"/><g transform="translate(360 242) scale(1.1)" fill="none" stroke="#8AB4FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v11H3z M8 20h8 M12 16v4"/></g><text x="402" y="254" font-size="14" font-weight="600" fill="#f2f1ec">Product UI with copilot panel</text><text x="402" y="274" font-size="11" fill="#8AB4FF"><tspan x="402" dy="0">Amplify Hosting</tspan></text><text x="356" y="316" font-size="10" fill="#8b90a0">product · tenant</text><title>Streams answers; shows proposed actions with a diff.</title></g><g data-component="edge"><rect x="340" y="40" width="252" height="112" rx="14" fill="#151824" stroke="#B9A7FF" stroke-opacity="0.55"/><g transform="translate(360 62) scale(1.1)" fill="none" stroke="#B9A7FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></g><text x="402" y="74" font-size="14" font-weight="600" fill="#f2f1ec">Edge protection</text><text x="402" y="94" font-size="11" fill="#B9A7FF"><tspan x="402" dy="0">CloudFront + AWS WAF</tspan></text><text x="356" y="136" font-size="10" fill="#8b90a0">edge · operational</text><title>Per-tenant rate limits and abuse controls.</title></g><g data-component="identity"><rect x="640" y="40" width="252" height="112" rx="14" fill="#151824" stroke="#B9A7FF" stroke-opacity="0.55"/><g transform="translate(660 62) scale(1.1)" fill="none" stroke="#B9A7FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M2 21c1-4 3.8-6 7-6 1.6 0 3 .4 4.2 1.2 M16 15h6 M19 12v6"/></g><text x="702" y="74" font-size="14" font-weight="600" fill="#f2f1ec">Tenant identity</text><text x="702" y="94" font-size="11" fill="#B9A7FF"><tspan x="702" dy="0">Amazon Cognito</tspan></text><text x="656" y="136" font-size="10" fill="#8b90a0">identity · identity</text><title>Session with tenant ID and role claims.</title></g><g data-component="copilot-api"><rect x="640" y="220" width="252" height="112" rx="14" fill="#151824" stroke="#B9A7FF" stroke-opacity="0.55"/><g transform="translate(660 242) scale(1.1)" fill="none" stroke="#B9A7FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4L3 12l5 8 M16 4l5 8-5 8 M13.5 5l-3 14"/></g><text x="702" y="254" font-size="14" font-weight="600" fill="#f2f1ec">Copilot API</text><text x="702" y="274" font-size="11" fill="#B9A7FF"><tspan x="702" dy="0">API Gateway + Lambda</tspan></text><text x="656" y="316" font-size="10" fill="#8b90a0">copilot-api · tenant</text><title>Resolves tenant scope; refuses calls without it.</title></g><g data-component="gateway"><rect x="940" y="40" width="252" height="112" rx="14" fill="#151824" stroke="#B9A7FF" stroke-opacity="0.55"/><g transform="translate(960 62) scale(1.1)" fill="none" stroke="#B9A7FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h6 M9 12l5-6h7 M9 12l5 6h7 M14 12h7"/></g><text x="1002" y="74" font-size="14" font-weight="600" fill="#f2f1ec">Model gateway</text><text x="1002" y="94" font-size="11" fill="#B9A7FF"><tspan x="1002" dy="0">Bedrock inference profiles +</tspan><tspan x="1002" dy="14">usage plans</tspan></text><text x="956" y="136" font-size="10" fill="#8b90a0">gateway · tenant</text><title>Per-tenant budget, cache key includes tenant ID.</title></g><g data-component="model"><rect x="1240" y="40" width="252" height="112" rx="14" fill="#151824" stroke="#5EE6CF" stroke-opacity="0.55"/><g transform="translate(1260 62) scale(1.1)" fill="none" stroke="#5EE6CF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/></g><text x="1302" y="74" font-size="14" font-weight="600" fill="#f2f1ec">Assistant model</text><text x="1302" y="94" font-size="11" fill="#5EE6CF"><tspan x="1302" dy="0">Claude on Amazon Bedrock</tspan></text><text x="1256" y="136" font-size="10" fill="#8b90a0">model · tenant</text><title>Fast model for answers; larger model for complex actions.</title></g><g data-component="tenant-index"><rect x="940" y="400" width="252" height="112" rx="14" fill="#151824" stroke="#FFC07A" stroke-opacity="0.55"/><g transform="translate(960 422) scale(1.1)" fill="none" stroke="#FFC07A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M16 16l5 5 M8 11h6 M11 8v6"/></g><text x="1002" y="434" font-size="14" font-weight="600" fill="#f2f1ec">Tenant-partitioned index</text><text x="1002" y="454" font-size="11" fill="#FFC07A"><tspan x="1002" dy="0">Aurora PostgreSQL</tspan></text><text x="956" y="496" font-size="10" fill="#8b90a0">tenant-index · tenant</text><title>Namespace per tenant; no cross-tenant query path.</title></g><g data-component="actions"><rect x="940" y="220" width="252" height="112" rx="14" fill="#151824" stroke="#5EE6CF" stroke-opacity="0.55"/><g transform="translate(960 242) scale(1.1)" fill="none" stroke="#5EE6CF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></g><text x="1002" y="254" font-size="14" font-weight="600" fill="#f2f1ec">Product actions</text><text x="1002" y="274" font-size="11" fill="#5EE6CF"><tspan x="1002" dy="0">AgentCore Gateway (MCP)</tspan></text><text x="956" y="316" font-size="10" fill="#8b90a0">actions · tenant</text><title>Typed, reversible operations; writes need user confirmation.</title></g><g data-component="app-db"><rect x="1240" y="220" width="252" height="112" rx="14" fill="#151824" stroke="#FFC07A" stroke-opacity="0.55"/><g transform="translate(1260 242) scale(1.1)" fill="none" stroke="#FFC07A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6 M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="1302" y="254" font-size="14" font-weight="600" fill="#f2f1ec">Product database</text><text x="1302" y="274" font-size="11" fill="#FFC07A"><tspan x="1302" dy="0">Aurora PostgreSQL</tspan></text><text x="1256" y="316" font-size="10" fill="#8b90a0">app-db · tenant</text><title>Tenant data with row-level security.</title></g><g data-component="meter"><rect x="1240" y="400" width="252" height="112" rx="14" fill="#151824" stroke="#FFC07A" stroke-opacity="0.55"/><g transform="translate(1260 422) scale(1.1)" fill="none" stroke="#FFC07A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10 M12 20V4 M19 20v-7 M3 20h18"/></g><text x="1302" y="434" font-size="14" font-weight="600" fill="#f2f1ec">Usage meter</text><text x="1302" y="454" font-size="11" fill="#FFC07A"><tspan x="1302" dy="0">Cost and Usage Reports +</tspan><tspan x="1302" dy="14">QuickSight</tspan></text><text x="1256" y="496" font-size="10" fill="#8b90a0">meter · operational</text><title>Tokens and actions per tenant, exported to billing.</title></g><g data-component="traces"><rect x="1540" y="40" width="252" height="112" rx="14" fill="#151824" stroke="#FF9FCB" stroke-opacity="0.55"/><g transform="translate(1560 62) scale(1.1)" fill="none" stroke="#FF9FCB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></g><text x="1602" y="74" font-size="14" font-weight="600" fill="#f2f1ec">Traces</text><text x="1602" y="94" font-size="11" fill="#FF9FCB"><tspan x="1602" dy="0">CloudWatch + X-Ray</tspan></text><text x="1556" y="136" font-size="10" fill="#8b90a0">traces · operational</text><title>Per-tenant latency, errors, refusals.</title></g><g data-component="evals"><rect x="1540" y="220" width="252" height="112" rx="14" fill="#151824" stroke="#FF9FCB" stroke-opacity="0.55"/><g transform="translate(1560 242) scale(1.1)" fill="none" stroke="#FF9FCB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M8 12l3 3 5-6"/></g><text x="1602" y="254" font-size="14" font-weight="600" fill="#f2f1ec">Release evals</text><text x="1602" y="274" font-size="11" fill="#FF9FCB"><tspan x="1602" dy="0">Bedrock Evaluations</tspan></text><text x="1556" y="316" font-size="10" fill="#8b90a0">evals · internal</text><title>Task set per feature plus cross-tenant probes.</title></g><text x="40" y="574" font-size="11" fill="#8b90a0">AWS realization · generated from the ai-architect catalog · role glyphs, no vendor icons</text></svg>
